 la société (biais, manipulation, désinformation, vie privée). B Lab veut une diligence raisonnable spécifique. Question récente, pas de seuil — toute distribution déclenche le signal. Périmètre : opérations directes de l'entreprise."},{id:"risk_prod_3",ref:"FR3.1.d",question:"Sur le dernier exercice, au moins 10 % de votre chiffre d'affaires provient-il de la vente de produits chimiques classés dangereux ?",signal:"Référentiels typiques : REACH (UE), classification SGH/CLP. Au-delà du seuil, des exigences environnementales et droits humains additionnelles s'activent. Périmètre : opérations directes de l'entreprise."},{id:"risk_prod_4",ref:"FR3.1.e",question:"Sur le dernier exercice, au moins 10 % de votre chiffre d'affaires provient-il de la vente de plastiques à usage unique en matières vierges non renouvelables — dans l'un de ces 3 cas : (1) produits en plastique à usage unique fabriqués par/pour l'entreprise, (2) emballages plastiques à usage unique fabriqués par/pour l'entreprise, (3) produits emballés dans des plastiques à usage unique ?",signal:"Impact environnemental majeur de la pollution plastique. Périmètre : opérations directes + production externalisée. Pour les emballages : primaires (au contact du produit) et secondaires (regroupement). Question pertinente même pour des PME de distribution si elles emballent en marque blanche."},{id:"risk_prod_5",ref:"FR3.1.f",question:"Sur le dernier exercice, au moins 10 % de votre chiffre d'affaires provient-il de la vente de produits chimiques agricoles, hors pesticides et engrais d'origine naturelle ?",signal:"Pesticides et engrais de synthèse contribuent à la dégradation des sols, à la pollution de l'eau et à la perte de biodiversité. Les produits naturels (compost, biocontrôle) sont exclus du périmètre. Périmètre : opérations directes de l'entreprise."}]},{id:"operations",label:"Vos opérations",icon:"🏭",description:"Activités principales et leurs impacts sur l'environnement et les communautés.",questions:[{id:"risk_ops_1",ref:"FR3.1.g",question:"Sur le dernier exercice, vos opérations ont-elles eu — ou pu avoir — des impacts négatifs sur les droits ou les terres de peuples autochtones ?",signal:"Enjeu droits humains majeur reconnu par les Principes directeurs ONU et la Convention 169 OIT. Concerne notamment les activités d'extraction, foncier, agriculture extensive, infrastructures dans des territoires autochtones. Périmètre : opérations directes de l'entreprise."},{id:"risk_ops_2",ref:"FR3.1.h",question:"Au cours des 3 dernières années, votre entreprise a-t-elle connu des accidents mortels du travail ou des sanctions liées à la santé et sécurité au travail ?",signal:"Indicateur direct de pratiques santé-sécurité défaillantes. Période d'évaluation plus large (3 ans, pas 1) car ces incidents ont des effets durables sur la culture et la responsabilité de l'entreprise. Périmètre : opérations directes de l'entreprise."},{id:"risk_ops_3",ref:"FR3.1.i",question:"Sur le dernier exercice, votre entreprise a-t-elle fabriqué (ou externalisé la fabrication) de produits issus principalement de matières provenant des industries extractives ?",signal:"Ressources non renouvelables (minéraux, métaux, hydrocarbures hors fossile direct couvert par FR1.2). Couvre les métaux rares, sable, granulats. Périmètre : opérations directes + production externalisée — important pour les marques qui ne fabriquent pas elles-mêmes."},{id:"risk_ops_4",ref:"FR3.1.j",question:"Au cours des 3 dernières années, vos opérations ont-elles directement contribué à une conversion d'écosystèmes (perte d'habitat, érosion des sols, perte de biodiversité) ?",signal:"Exemples : défrichement, drainage de zones humides, terrassement de zones naturelles, urbanisation de terres agricoles. Période 3 ans car les impacts sont durables et la responsabilité s'étale. Périmètre : opérations directes de l'entreprise."},{id:"risk_ops_5",ref:"FR3.1.k",question:"Sur le dernier exercice, votre entreprise a-t-elle utilisé des produits chimiques dangereux dans ses principaux processus de production ?",signal:"Différent de FR3.1.d (vente) — ici on parle d'usage interne. Concerne typiquement la fabrication, le nettoyage industriel, les laboratoires. Pas de seuil 10 % : tout usage significatif déclenche le signal. Périmètre : opérations directes de l'entreprise."},{id:"risk_ops_6",ref:"FR3.1.l",question:"Sur le dernier exercice, votre entreprise a-t-elle exploité une activité de production à forte consommation d'eau dans une zone à stress hydrique ?",signal:"Référentiels typiques pour identifier les zones à stress hydrique : Aqueduc (WRI), Water Risk Filter (WWF). Concerne notamment l'agroalimentaire, le textile, les data centers, la fabrication électronique. Périmètre : opérations directes de l'entreprise."}]},{id:"reputation",label:"Votre réputation",icon:"🛡️",description:"Risques liés aux pratiques de la chaîne d'approvisionnement et aux allégations marketing.",questions:[{id:"risk_rep_1",ref:"FR3.1.m",question:"Au cours des 3 dernières années, votre entreprise a-t-elle fait l'objet de litiges, de sanctions ou d'allégations publiques de travail forcé dans sa chaîne d'approvisionnement ?",signal:"Référentiels typiques : Modern Slavery Act (UK), CSDDD (UE), Devoir de Vigilance (France), LkSG (Allemagne). Allégations = même non confirmées (presse, ONG, syndicats) déclenchent le signal. Périmètre élargi : chaîne d'approvisionnement (et non opérations directes uniquement)."},{id:"risk_rep_2",ref:"FR3.1.n",question:"Au cours des 3 dernières années, votre entreprise a-t-elle fait l'objet de litiges, de sanctions ou d'allégations publiques de marketing trompeur ou d'écoblanchiment ?",signal:"Risque de plus en plus surveillé : Directive ECGT (UE, sept. 2026), procès classe contre les claims environnementaux. Allégations publiques (presse, ONG, autorités) suffisent. Périmètre : opérations directes de l'entreprise."}]}],Rt=mi.reduce((e,t)=>e+t.questions.length,0),gi=e=>e?Object.values(e).filter(t=>t==="yes").length:0,Nc=[{id:"foundation",label:"Socle",labelEn:"Foundation",icon:"🏛️",description:"Établit l'engagement de l'entreprise sur les principes JEDI : leadership représentatif, politiques revues au prisme de l'équité, montée en compétence par la formation et l'audit d'équité.",actions:[{ref:"JEDI2.a",label:"L'entreprise s'engage publiquement sur les principes JEDI"},{ref:"JEDI2.b",label:"L'entreprise renforce les connaissances et capacités JEDI de ses dirigeants"},{ref:"JEDI2.c",label:"L'entreprise revoit et met à jour ses politiques existantes au prisme des principes JEDI"},{ref:"JEDI2.d",label:"La plus haute instance de gouvernance et l'équipe de direction reflètent la diversité de la communauté"},{ref:"JEDI2.e",label:"L'entreprise réalise un audit d'équité"}]},{id:"workplace",label:"Lieu de travail",labelEn:"Within the Workplace",icon:"🏢",description:"Favorise des pratiques inclusives au sein de l'entreprise : groupes d'affinité, recrutement inclusif, mentorat, accessibilité des outils de communication interne.",actions:[{ref:"JEDI2.f",label:"L'entreprise soutient au moins deux groupes de ressources ou d'affinité de collaborateurs"},{ref:"JEDI2.g",label:"L'entreprise met en œuvre des pratiques de recrutement inclusif"},{ref:"JEDI2.h",label:"L'entreprise offre des opportunités de parrainage et de mentorat à ses employés"},{ref:"JEDI2.i",label:"L'entreprise développe et met en œuvre un guide de langage inclusif pour ses communications internes"},{ref:"JEDI2.j",label:"L'entreprise augmente la proportion de collaborateurs issus de groupes sous-représentés pour refléter la diversité de sa communauté"},{ref:"JEDI2.k",label:"L'entreprise propose des types de congés payés additionnels au-delà des minima légaux"},{ref:"JEDI2.l",label:"Les outils de communication interne de l'entreprise respectent les standards d'accessibilité"}]},{id:"beyond",label:"Au-delà",labelEn:"Beyond the Workplace",icon:"🌍",description:"Étend les principes JEDI à la chaîne d'approvisionnement, aux clients et à la société : actions publiques, diversité des fournisseurs, design inclusif des produits, accessibilité du site web, action collective.",actions:[{ref:"JEDI2.m",label:"Le site web de l'entreprise respecte les standards d'accessibilité"},{ref:"JEDI2.n",label:"L'entreprise communique publiquement son plan d'action JEDI et ses progrès"},{ref:"JEDI2.o",label:"L'entreprise promeut la diversité parmi ses fournisseurs locaux"},{ref:"JEDI2.p",label:"L'entreprise développe et met en œuvre un guide de communication externe inclusive et de contenu éthique"},{ref:"JEDI2.q",label:"L'entreprise évalue le caractère inclusif d'un produit ou service"},{ref:"JEDI2.r",label:"L'entreprise repense un produit ou service pour le rendre plus inclusif"},{ref:"JEDI2.s",label:"L'entreprise participe à au moins une action collective pour faire avancer les principes JEDI"}]}],ua={individuelle:{ref:"JEDI2.1",y0:1,y3:1,y5:1,sets:["foundation","beyond"]},micro:{ref:"JEDI2.2",y0:2,y3:3,y5:3,sets:["foundation","workplace","beyond"]},petite:{ref:"JEDI2.3",y0:2,y3:4,y5:4,sets:["foundation","workplace","beyond"]},moyenne:{ref:"JEDI2.4",y0:2,y3:5,y5:5,sets:["foundation","workplace","beyond"]},grande:{ref:"JEDI2.5",y0:2,y3:6,y5:6,sets:["foundation","workplace","beyond"]},xl:{ref:"JEDI2.6",y0:2,y3:7,y5:7,sets:["foundation","workplace","beyond"]},xxl:{ref:"JEDI2.6",y0:2,y3:7,y5:7,sets:["foundation","workplace","beyond"]}},ca=Nc.reduce((e,t)=>e+t.actions.length,0),Ic=e=>e?Object.values(e).filter(t=>t==="done").length:0,Bc=e=>ua[e]||ua.petite,Fc=[{id:"mentorat",ref:"Mentorat",icon:"🤝",label:"Mentorat",description:"L'entreprise accompagne d'autres acteurs de son secteur, de sa profession ou de sa chaîne de valeur pour faire progresser leurs impacts sociaux ou environnementaux.",examples:"Arrangements formels où des individus ou organisations sont partenaires pour partager des connaissances : formation, conseil, retours d'expérience."},{id:"leadership",ref:"Leadership d'opinion",icon:"💡",label:"Leadership d'opinion",description:"L'entreprise utilise le leadership d'opinion pour conduire un changement systémique vers une économie équitable, inclusive et régénérative.",examples:"Enseignement ou conférences dans des établissements éducatifs, articles de blog, publication d'articles de recherche, interventions dans des forums publics."},{id:"collaboration",ref:"Collaboration multi-parties",icon:"🌐",label:"Collaboration multi-parties",description:"L'entreprise collabore avec plusieurs parties prenantes pour faire progresser les impacts sociaux ou environnementaux.",examples:"Travail avec associations professionnelles, institutions académiques ou autres entreprises pour livrer des impacts spécifiques et mesurables : guides sectoriels, infrastructures partagées, investissements communautaires conjoints."},{id:"recherche",ref:"Recherche externe",icon:"🔬",label:"Recherche externe",description:"L'entreprise contribue à des recherches externes pour faire progresser les impacts sociaux ou environnementaux.",examples:"Contributions financières ou en nature, partage de données avec une université ou une ONG, financement d'équipement ou de déplacements pour une recherche sociale ou environnementale."},{id:"plaidoyer",ref:"Plaidoyer politique",icon:"📢",label:"Plaidoyer politique",description:"L'entreprise promeut des politiques publiques pour faire progresser les impacts sociaux ou environnementaux.",examples:"Engagement direct ou indirect avec des représentants politiques, création d'une pétition publique, publication d'un appel à soutenir une législation à impact social ou environnemental positif."}],da={individuelle:{ref:"GACA2.1",y0:1,y3:1,y5:1},micro:{ref:"GACA2.1",y0:1,y3:1,y5:1},petite:{ref:"GACA2.2",y0:1,y3:2,y5:2},moyenne:{ref:"GACA2.3",y0:1,y3:2,y5:2},grande:{ref:"GACA2.4",y0:2,y3:2,y5:2,gaca26:!0},xl:{ref:"GACA2.4",y0:2,y3:2,y5:2,gaca26:!0},xxl:{ref:"GACA2.5",y0:2,y3:4,y5:4,gaca26:!0}},pa=Fc.length,Wc=e=>e?Object.values(e).filter(t=>t==="done").length:0,Mc=e=>da[e]||da.petite,Ye=[{id:"fr",code:"FR",name:"Fondations (Foundation Requirements)",short:"Fondations",color:"#0f1f1f",icon:"◆",description:"Les pré-requis non négociables : éligibilité, mission ancrée juridiquement, évaluation des risques. Sans ces fondations, pas de certification possible.",questions:[{id:"fr_1a",ref:"FR1.1 / FR1.2",kind:"factual",question:"Votre activité et vos sources de revenus sont-ils en dehors des industries exclues par B Lab ?",help:"Liste officielle V2.2 (20 février 2026) — 6 industries inéligibles : production d'énergies fossiles, jeux d'argent, pornographie, prisons et centres de détention (y compris travail carcéral), tabac, armement. Le seuil est de 1% du chiffre d'affaires annuel par industrie listée (pas en cumulé), évalué dans 3 cas : (1) production/distribution directe d'un produit ou service de ces industries, (2) prestations vendues à des clients de ces industries — lobbying/PR, marketing/branding/publicité, produits sur-mesure, (3) investissements directs dans ces industries. À noter : depuis V2.2, le conseil en management, le juridique et les autres services professionnels NE sont plus dans les industries inéligibles. Réponse 'Oui' = aucun revenu issu de ces activités. 'En partie' = revenus à clarifier (zone grise). 'Non' = >1% sur au moins une industrie — deal breaker pour la certification.",critique:!0},{id:"fr_1b",ref:"FR1 — preuves",question:"Avez-vous formalisé la cartographie de vos revenus par activité pour démontrer votre éligibilité ?",help:"Au-delà du fait d'être éligible, l'audit demande une cartographie chiffrée et documentée des sources de revenus de la dernière année fiscale, permettant de démontrer que moins de 1% du CA provient de chacune des 6 industries inéligibles. Cette cartographie doit couvrir 3 angles : (1) revenus de production/distribution directe par activité, (2) pour les entreprises B2B, classification des clients par industrie principale (un client est dans une industrie inéligible si ≥5% de son CA en provient), (3) pour les sociétés financières, revenus issus d'investissements directs. Sans cette traçabilité formalisée, l'éligibilité ne peut pas être vérifiée par le tiers certificateur.",critique:!0},{id:"fr_2",ref:"FR2.1",kind:"factual",question:"Vos statuts juridiques intègrent-ils explicitement la mission d'impact (Mission Lock / clause B Corp) ?",help:"Exigence B Corp historique : la mission sociale et environnementale doit être inscrite dans les statuts pour rendre les dirigeants légalement responsables de la prise en compte des parties prenantes. Soit la clause est rédigée (Oui), soit elle ne l'est pas (Non), soit elle est imparfaite/partielle (Partiel). À noter (V2.2 du 20 février 2026) : un seuil de 10 millions USD de chiffre d'affaires a été introduit dans le Clarifying the Compliance Criteria — au-dessus de ce seuil, les modalités d'ancrage juridique peuvent être plus exigeantes selon la juridiction. Pour les entreprises sous 10M USD (cas typique des PME), la clause Mission Lock dans les statuts reste l'exigence centrale.",examples:"Pour une SA ou Sàrl suisse : la clause Mission Lock est ajoutée au but social dans les statuts via une AG extraordinaire et notarisée. B Lab fournit des modèles de clauses adaptés aux droits nationaux. Délai pratique : 4-8 semaines (rédaction + AG + notaire + RC). Coût : 1'500-3'500 CHF (notaire + frais RC). Cas Partiel typique : entreprise qui a inscrit une mission RSE générique mais sans la clause de responsabilité aux parties prenantes — il faut compléter. À anticiper en parallèle du diagnostic, c'est souvent le chantier qui prend le plus de temps administratif.",critique:!0},{id:"fr_3",ref:"FR3.1",question:"Avez-vous réalisé l'évaluation des risques B Corp (Risk Tool) sur l'ensemble de vos activités ?",help:"Le Risk Tool (FR3.1) est un questionnaire officiel B Lab composé de 14 questions (FR3.1.a à FR3.1.n) sur des pratiques à risque non couvertes ailleurs dans les standards. Selon les réponses, des sous-exigences additionnelles de due diligence s'ajoutent automatiquement à l'évaluation, principalement dans PSG, ESC et HR — proportionnées au profil de risque et à la taille. Dans certains cas, une sous-exigence ajoutée en remplace une autre déjà applicable (par exemple PSG3.4 remplace PSG3.2 sur le suivi des réclamations). Points essentiels : (1) les Micro-entreprises et entreprises sans collaborateurs sont exemptées de FR3.1, (2) les réponses aux 14 questions sont publiquement affichées sur le profil B Corp de l'entreprise, (3) les réponses ne sont pas vérifiées par audit tiers mais relèvent de l'exigence d'information complète et exacte. Un « oui » assumé et bien documenté est plus solide stratégiquement qu'un « non » non étayé : il déclenche les bonnes due diligences plutôt que d'exposer l'entreprise à une remise en cause ultérieure. Ce questionnaire doit être complété dans le cadre du Setup B Impact avant le Self-Assessment.",examples:"Preuves attendues par l'auditeur (sur les sous-exigences déclenchées par les « oui ») : pour chaque sous-exigence additionnelle ajoutée à l'évaluation, les preuves attendues sont celles définies par la sous-exigence elle-même (politique, processus, records, formation). L'auditeur vérifiera la cohérence entre les réponses Risk Tool et la réalité opérationnelle de l'entreprise, ainsi que la mise en œuvre effective des due diligences additionnelles.",tailles:["petite","moyenne","grande","xl","xxl"],critique:!0,hasRiskTool:!0}]},{id:"psg",code:"PSG",name:"Mission & Gouvernance des Parties Prenantes",short:"Mission & Gouvernance",color:"#0d4f3c",icon:"◐",description:"Raison d'être publique, gouvernance impliquant les parties prenantes, traitement des réclamations, marketing responsable, supervision de la direction et reporting transparent. Codes B Lab : PSG1 à PSG6.",questions:[{id:"psg_1",ref:"PSG1.1",question:"Votre raison d'être (mission d'impact) est-elle déclarée publiquement et accessible ?",help:"PSG1.1 demande une déclaration publique formelle de la raison d'être (purpose statement). À ne pas confondre avec un slogan marketing ou une « vision produit » : il s'agit d'une formulation qui exprime la contribution sociale ou environnementale de l'entreprise — ce qu'elle apporte au-delà de la performance économique. Si une mission existe déjà sur le site, l'exigence porte alors uniquement sur sa pertinence (lien avec l'activité) et son ancrage stratégique (orientation des décisions). S'applique à toutes les tailles, dès l'Année 0.",examples:"Preuves attendues par l'auditeur (B Lab) : déclaration publique de raison d'être sur la page web de l'entreprise. Si la déclaration ne détaille pas la pertinence business et l'intégration dans la stratégie, prévoir un document complémentaire qui le fait (page dédiée, manifeste, rapport d'impact). Pour une entreprise sans site web : information publique officielle (brochure, contenu sur le site d'une autre organisation)."},{id:"psg_2",ref:"PSG2.1 / PSG2.2",question:"Disposez-vous d'un mécanisme formel pour intégrer les parties prenantes dans vos décisions ?",help:"PSG2.1 (mécanisme — entreprises sans collaborateurs, Micro, Petites et Moyennes) : pas besoin d'un comité multi-parties prenantes formalisé. Un mécanisme suffit dès lors qu'il est documenté et récurrent — par exemple : sondages clients réguliers, points équipe avec ordre du jour, retours fournisseurs structurés, comité consultatif client. PSG2.2 (politique formelle de gouvernance des parties prenantes) ne s'applique qu'aux Grandes et plus. Ce qui compte pour l'auditeur : la régularité, la traçabilité, et l'évidence que les retours influencent réellement les décisions.",examples:"Preuves attendues par l'auditeur : procès-verbaux de réunions, résultats d'enquêtes, charte d'un groupe de travail multi-parties prenantes ou comité consultatif. Pour PSG2.2 (grandes entreprises) : document de Politique de Gouvernance des Parties Prenantes décrivant le modèle, les critères d'identification, comment les intérêts sont pris en compte, et les mécanismes d'engagement. Procès-verbaux du Conseil approuvant la politique. Communications internes (email, intranet) avec lien vers la politique accessible aux collaborateurs."},{id:"psg_3",ref:"PSG2.3",question:"Avez-vous réalisé une analyse de matérialité de vos enjeux ESG ?",help:"Identifier les enjeux sociaux et environnementaux les plus matériels pour votre activité et vos parties prenantes. Approche double matérialité ou matérialité d'impact.",examples:"Preuves attendues par l'auditeur : rapport d'analyse de matérialité (ou documentation du processus) montrant l'engagement avec toutes les parties prenantes spécifiées. Le document doit couvrir les enjeux droits humains et environnementaux, et expliquer comment les seuils ont été fixés et comment les impacts ont été évalués (sévérité, probabilité). Daté de moins de 36 mois, avec procès-verbaux d'une revue intermédiaire avec les parties prenantes. Lien vers le rapport d'impact annuel ou page web où la matrice de matérialité, méthodologie et synthèse sont publiquement disponibles.",tailles:["grande","xl","xxl"]},{id:"psg_9",ref:"PSG2.4",question:"Pour les enjeux matériels non couverts par les standards B Corp, fixez-vous des cibles et publiez-vous vos progrès chaque année ?",help:"PSG2.4 prolonge l'analyse de matérialité : une fois les enjeux matériels identifiés, l'entreprise traite ceux qui ne sont pas déjà couverts par les standards B Lab en fixant des objectifs et en rapportant publiquement ses progrès chaque année. S'applique aux entreprises Grande et plus, tous secteurs.",examples:"Preuves attendues par l'auditeur : liste des enjeux matériels identifiés non adressés par le standard B Lab. Objectifs (cibles) définis pour chacun de ces enjeux, avec horizon temporel. Rapport annuel public présentant les progrès réalisés sur ces cibles. Procès-verbaux de validation des cibles par la plus haute instance dirigeante.",tailles:["grande","xl","xxl"]},{id:"psg_4",ref:"PSG3.1 / PSG3.2",question:"Disposez-vous d'une procédure formelle de traitement des réclamations des parties prenantes ?",help:"Mécanisme accessible aux collaborateurs, clients, fournisseurs et communauté pour signaler des préoccupations, avec suivi documenté. PSG3.1 (procédure publique) s'applique aux entreprises sans collaborateurs, Micro, Petites et Moyennes ; PSG3.2 (recensement et responsabilité) aux Micro, Petites et Moyennes. Les Grandes et plus relèvent de PSG3.3/3.4.",examples:"Preuves attendues par l'auditeur : lien vers le formulaire de réclamation sur le site, ou document détaillant le mécanisme alternatif (email, hotline, politique de porte ouverte). Le document doit expliquer clairement les motifs de recevabilité, les étapes du processus, les délais, et la facilitation des résolutions. Doit aussi détailler les processus de protection des plaignants contre les représailles. Système de suivi (tableur ou logiciel), résumés annuels du statut et de la nature des réclamations. Organigramme ou fiche de poste identifiant le responsable.",tailles:["individuelle","micro","petite","moyenne"]},{id:"psg_8",ref:"PSG3.3 / PSG3.4",question:"Disposez-vous d'une procédure de réclamation publique, avec suivi et reporting à la plus haute instance de direction ?",help:"Version Grande entreprise du traitement des réclamations. PSG3.3 : procédure de réclamation accessible au public permettant aux parties prenantes de soumettre leurs réclamations en toute sécurité. PSG3.4 : recensement des réclamations, attribution de la responsabilité de leur résolution, et reporting à la fois en interne (plus haute instance dirigeante) et publiquement aux parties prenantes. S'applique aux entreprises Grande et plus, tous secteurs.",examples:"Preuves attendues par l'auditeur : lien vers le formulaire de réclamation public sur le site, ou document détaillant le mécanisme. Le document doit expliquer les motifs de recevabilité, les étapes, les délais, la facilitation des résolutions et la protection des plaignants contre les représailles. Système de suivi des réclamations (logiciel ou tableur). Organigramme ou fiches de poste identifiant les responsables. Procès-verbaux montrant le reporting des réclamations à la plus haute instance dirigeante. Rapport public présentant le statut et la nature des réclamations traitées.",tailles:["grande","xl","xxl"]},{id:"psg_5",ref:"PSG4.1 / PSG4.2",question:"Avez-vous des principes ou une politique de marketing et communication responsables ?",help:"Principes pour Micro/Petite, politique formelle supervisée par la direction pour Moyenne et plus. Les allégations sociales/environnementales doivent être précises, vérifiables, étayées par des données, véridiques, transparentes.",examples:"Preuves attendues par l'auditeur : ensemble documenté de principes pour le marketing et la communication responsables (politique interne ou section du code de conduite). Le document doit affirmer explicitement que les allégations sont précises, vérifiables, étayées, véridiques, transparentes, et que l'entreprise suit des règles éthiques pour les canaux sensibles. Pour PSG4.2 : politique formelle approuvée par la direction, organigramme/RACI désignant un responsable au sein du comité exécutif, sessions de communication aux collaborateurs (slides onboarding, lien intranet, attestation de lecture).",tailles:["micro","petite","moyenne","grande","xl","xxl"]},{id:"psg_6",ref:"PSG5.1 / PSG5.2",question:"La plus haute instance de direction supervise-t-elle activement la mission, l'impact et les parties prenantes ?",help:"Sujet inscrit à l'ordre du jour du Conseil/Comité de direction, traces écrites, formation des administrateurs sur les enjeux ESG du secteur. PSG5.1 s'applique aux Micro et plus ; PSG5.2 (inscription dans les statuts) aux Grandes et plus.",examples:"Preuves attendues par l'auditeur : procès-verbaux du Conseil ou de la plus haute instance dirigeante des 12 derniers mois, incluant un point d'agenda et une discussion sur les progrès en matière de raison d'être, performance sociale et environnementale, et mise en œuvre de la gouvernance des parties prenantes. Pour PSG5.2 : termes de référence officiels de la plus haute instance, indiquant explicitement la responsabilité de superviser la raison d'être, l'impact et les parties prenantes.",tailles:["micro","petite","moyenne","grande","xl","xxl"]},{id:"psg_7",ref:"PSG6.1",question:"Publiez-vous chaque année un rapport public sur vos performances sociales et environnementales ?",help:"Rapport annuel approuvé par la direction, accessible publiquement, sur les progrès ESG. Exigence des jalons Année 3/5 du cycle B Corp (Grandes et XL) — pas due pour la recertification immédiate (Année 0).",examples:"Preuves attendues par l'auditeur : rapport d'impact social et environnemental approuvé par la plus haute instance dirigeante, accessible publiquement sur le site, couvrant tous les indicateurs pertinents. À défaut d'un rapport annuel, l'auditeur acceptera un rapport complet publié au moins tous les deux ans, complété par des mises à jour intermédiaires plus légères ou des rapports thématiques publiés annuellement sur le site.",tailles:["grande","xl"],anneeY35:!0}]},{id:"fw",code:"FW",name:"Travail Équitable (Fair Work)",short:"Travail Équitable",color:"#1d4f74",icon:"◑",description:"Contrats clairs, salaires équitables, salaire de subsistance (Living Wage), retours des collaborateurs intégrés, mesure et amélioration de la culture. Codes B Lab : FW1 à FW4.",questions:[{id:"fw_1",ref:"FW1.1",question:"Tous vos salariés ont-ils un contrat de travail ou une lettre d'engagement signée ?",help:"FW1.1 s'applique aux entreprises Micro et plus. Les entreprises sans collaborateurs (uniquement des associés détenant 10 %+) sont hors du périmètre Fair Work.",examples:"Preuves attendues par l'auditeur : contrats de travail écrits ou lettres d'engagement signées. Liste des salariés indiquant qui dispose d'un contrat signé, d'une lettre d'engagement, ou d'une lettre d'engagement émise après l'embauche. Entretiens avec les salariés. Attestations confirmant que chaque salarié a bien reçu une copie de son contrat.",tailles:["micro","petite","moyenne","grande","xl","xxl"]},{id:"fw_2",ref:"FW1.2",question:"Appliquez-vous un délai de prévenance équitable pour les salariés à horaires variables ?",help:"Pour les emplois avec horaires irréguliers, communication avancée raisonnable des plannings, et règles symétriques pour employeur/employé en cas d'annulation. FW1.2 s'applique aux entreprises Petite et plus.",examples:"Preuves attendues par l'auditeur : politique, procédure ou règlement intérieur incluant les éléments FW1.2.1a-c (délai de prévenance pour la communication des plannings, règles d'annulation symétriques côté employeur/employé, règles de paiement en cas de force majeure). Entretiens avec les salariés concernés. Records de communication aux salariés (email, intranet) ou règlement accessible.",tailles:["petite","moyenne","grande","xl","xxl"]},{id:"fw_3",ref:"FW2.1",question:"Avez-vous une politique excluant la demande des antécédents salariaux des candidats ?",help:"Pratique d'équité salariale : ne pas reproduire les biais salariaux passés. FW2.1 s'applique aux entreprises Petite et plus.",examples:"Preuves attendues par l'auditeur : politique, procédure ou règlement intérieur confirmant l'engagement et incluant les éléments FW2.1.1a-b. Entretiens avec les salariés (notamment ceux qui ont participé à des recrutements).",tailles:["petite","moyenne","grande","xl","xxl"]},{id:"fw_4",ref:"FW2.2",question:"Vos collaborateurs sont-ils informés clairement de la manière dont leur salaire est déterminé ?",help:"Transparence sur la grille, les composantes et les avantages. FW2.2 s'applique aux entreprises Micro et plus.",examples:"Preuves attendues par l'auditeur : records de communication (email, fiches de paie, intranet) ou règlement/politique accessible. Entretiens avec les collaborateurs. Bulletins de salaire écrits incluant les éléments FW2.2.2a-c. Bulletins rédigés dans la langue officielle de travail ou une langue comprise par le salarié.",tailles:["micro","petite","moyenne","grande","xl","xxl"]},{id:"fw_5",ref:"FW2.4 / FW2.5",question:"Calculez-vous et publiez-vous régulièrement votre écart salarial femmes-hommes ?",help:"Calcul annuel, méthodologie documentée. FW2.4 (calcul de l'écart) s'applique aux Grandes et plus ; FW2.5 (publication de l'écart) aux XL et XXL. La Suisse impose déjà l'analyse d'égalité salariale aux entreprises de 100 collaborateurs et plus (Loi sur l'égalité), ce qui prépare partiellement à FW2.4.",examples:"Preuves attendues par l'auditeur : calcul de chaque écart salarial femmes-hommes, données utilisées, titre/note précisant le type de calcul, méthodologie expliquée. Données incluant les éléments FW2.4.3a-c et excluant FW2.4.4a-d. Pour FW2.5 : lien vers la page web de l'entreprise ou rapport public présentant les écarts annuels avec explication de la méthodologie.",tailles:["grande","xl","xxl"]},{id:"fw_6",ref:"FW2.8",kind:"factual",question:"Versez-vous un salaire de subsistance (Living Wage) à 100% de vos salariés ?",help:"Pas le salaire minimum légal ni la CCT, mais le coût de la vie réel selon Global Living Wage Coalition (option a), ou un salaire couvert par une convention collective qualifiante (option b/c). Exigence des jalons Année 3/5 du cycle B Corp (Micro et plus) — pas due pour la recertification immédiate (Année 0). Reste un sujet stratégique majeur en Suisse romande où la CCT peut être insuffisante.",examples:"Preuves attendues par l'auditeur (selon l'option choisie a, b ou c par localisation) : liste précisant l'option par site, données de paie (tableur ou bulletins), liste des estimations de Living Wage utilisées, calculs de Living Wage, décomposition des composantes salariales. Si CCT (option b) : copie de la convention collective active, reconnue par la législation, allant au-delà des minima légaux. Plan interne pour fermer un éventuel écart de Living Wage.",tailles:["micro","petite","moyenne","grande","xl","xxl"],anneeY35:!0,critique:!0},{id:"fw_7",ref:"FW3.1",question:"Disposez-vous d'un dispositif formel de représentation des salariés ?",help:"Comité d'entreprise, délégation, accord d'union, ou justification publique si les salariés ne souhaitent pas de mécanisme. Exigence des jalons Année 3/5 du cycle B Corp (XL et XXL) — pas due pour la recertification immédiate (Année 0).",examples:"Preuves attendues par l'auditeur : document de gouvernance (accord d'union, charte, mémorandum, règlement intérieur, politique). Liste des représentants et de leurs sites. Entretiens avec représentants et salariés. Procès-verbaux de réunions de représentation. Records de communication (PV, emails). Si pas de mécanisme : déclaration publique expliquant pourquoi les salariés n'en veulent pas, données utilisées (vote, feedback).",tailles:["xl","xxl"],anneeY35:!0},{id:"fw_8",ref:"FW3.2",question:"Collectez-vous et prenez-vous en compte régulièrement les retours de vos collaborateurs ?",help:"Enquêtes d'engagement, points individuels, feedback structuré, traces des actions découlant des retours. FW3.2 s'applique aux entreprises Petite et plus.",examples:"Preuves attendues par l'auditeur : communications avec les collaborateurs sur les décisions pertinentes et la prise en compte de leurs retours (copies d'emails, slides de réunions). Records d'ateliers, discussions de groupe ou enquêtes. Entretiens avec collaborateurs et représentants.",tailles:["petite","moyenne","grande","xl","xxl"]},{id:"fw_9",ref:"FW4.1",question:"Mesurez-vous régulièrement la culture d'entreprise et le bien-être au travail ?",help:"Mesure couvrant au moins deux thèmes parmi : satisfaction, bien-être, sentiment d'appartenance, engagement, sécurité psychologique. FW4.1 s'applique aux entreprises Petite et plus, dès l'Année 0. Le plan d'amélioration continue de la culture (FW4.2) relève des jalons Année 3/5.",examples:"Preuves attendues par l'auditeur : records d'ateliers, discussions de groupe ou enquêtes, communications (emails, PV, slides, intranet). Entretiens avec collaborateurs. Records de mesure montrant qu'au moins 2 thèmes (satisfaction, bien-être, appartenance, engagement, sécurité psychologique) sont inclus. Communication ou évaluation annuelle.",tailles:["petite","moyenne","grande","xl","xxl"]}]},{id:"jedi",code:"JEDI",name:"Justice, Équité, Diversité & Inclusion",short:"JEDI",color:"#7C5E0E",icon:"◒",description:"Collecte de données sur la diversité, actions JEDI structurées (Socle / Lieu de travail / Au-delà), équité salariale, accessibilité. JEDI2 propose 19 options dont l'entreprise choisit selon son contexte. Codes B Lab : JEDI1 et JEDI2.",questions:[{id:"jedi_1",ref:"JEDI1.1",question:"Collectez-vous des données pour comprendre la diversité de vos équipes ?",help:"Données démographiques, taux d'embauche, promotions, rémunérations par groupe — dans le respect de la protection des données. Discussion facilitée OU enquête (au choix de l'entreprise). JEDI1.1 s'applique à toutes les entreprises Petite et plus ; les micro-entreprises et entreprises sans collaborateurs en sont exemptées. Pour les Petites (10-49 collaborateurs), une discussion ou enquête facilitée annuelle suffit ; la collecte de données désagrégées sur ≥5 indicateurs concerne les Moyennes et plus (50+ collaborateurs).",examples:"Preuves attendues par l'auditeur — pour une discussion : notes de discussion par année requise, date et durée, ordre du jour et slides, communications aux collaborateurs, entretiens. Pour une enquête : résultats annuels, copie de l'enquête avec questions JEDI, communication explicative, copie du formulaire de collecte de données sur l'identité de genre, communication sur l'anonymat. Pour les Moyennes et plus : données désagrégées (tableur) sur catégories d'emploi, représentation au Conseil/Comex, taux de rétention, recrutement, promotion, formation, conditions de travail, salaires, perceptions culture d'entreprise.",tailles:["petite","moyenne","grande","xl","xxl"]},{id:"jedi_2",ref:"JEDI2",question:"Quelles actions JEDI avez-vous mises en œuvre, parmi les 19 options du menu B Lab ?",help:"JEDI2 fonctionne comme un menu de choix : l'entreprise ne réalise pas les 19 actions, mais en sélectionne un nombre calibré sur sa taille, réparties en 3 ensembles (Socle / Lieu de travail / Au-delà). En Année 0 (recertification immédiate), toutes les tailles doivent mettre en œuvre 2 actions (1 seule pour les entreprises sans collaborateurs). Le nombre augmente en Années 3 et 5 selon la taille. La grille interactive ci-dessous permet de faire le point avec le client.",examples:"Preuves attendues par l'auditeur : confirmation écrite des sous-exigences choisies et de leur ensemble (Socle JEDI2.a-e, Lieu de travail JEDI2.f-l, Au-delà JEDI2.m-s). Records des retours des parties prenantes et données (issues de JEDI1) montrant comment ils ont guidé le choix des actions. Plan documenté listant actions et statut (requis dès la taille Petite). Records de communication du plan aux parties prenantes (emails, slides, rapports). Plan accessible aux collaborateurs (drive partagé, intranet). Entretiens avec collaborateurs.",critique:!0,hasJediMenu:!0}]},{id:"hr",code:"HR",name:"Droits Humains (Human Rights)",short:"Droits Humains",color:"#7C2D52",icon:"◓",description:"Engagement public, identification des enjeux saillants, stratégie d'action, prévention/atténuation/réparation des impacts négatifs, collaboration avec les fournisseurs, traçabilité Living Wage dans la chaîne de prestation. Codes B Lab : HR1 à HR4.",questions:[{id:"hr_1",ref:"HR1.1 / HR1.2",question:"Avez-vous un engagement public en matière de droits humains ?",help:"HR1.1 (engagement public — Micro et Petites tous secteurs, Moyennes des services à faible empreinte) : déclaration publique de respect des droits humains, référencée aux Principes Directeurs des Nations Unies relatifs aux entreprises et aux droits humains (UNGPs). Pour HR1.1, une déclaration assez générale suffit, du moment qu'elle est publique et reconnaît la responsabilité de l'entreprise vis-à-vis de tous ceux affectés par ses opérations et sa chaîne de valeur. HR1.2 (politique formelle approuvée par la direction) s'applique aux Grandes et plus, ainsi qu'aux Moyennes des secteurs autres que services à faible empreinte.",examples:`Preuves attendues par l'auditeur : lien vers la page web de l'entreprise ou document politique public (autonome ou intégré). Si pas de site public : information publique officielle (brochure, contenu sur le site d'une autre organisation). Pour HR1.2 (politique formelle) : politique droits humains incluant les éléments HR1.2.2a-d, approuvée par la plus haute instance dirigeante (PV ou signature). Section précisant que la politique s'applique à "tous les individus et communautés affectés par les opérations et la chaîne de valeur de l'entreprise".`},{id:"hr_2",ref:"HR2.1 / HR2.2",question:"Avez-vous identifié et publié vos enjeux saillants en matière de droits humains ?",help:'Cartographie des risques droits humains dans vos opérations et votre chaîne de valeur. "Saillant" = à la fois sévère et probable.',examples:"Preuves attendues par l'auditeur : document interne (texte ou tableur) listant et priorisant les enjeux droits humains, avec section méthodologie. Records d'évaluation d'impact : données de performance sociale, engagement parties prenantes, registre d'impacts, outils d'évaluation (cartes spatiales, guidance industrielle), classement des matières premières à haut risque, matrice de matérialité. Document daté de moins de 36 mois. Pour HR2.2 : lien vers la page web ou rapport public listant les enjeux saillants et la méthodologie.",tailles:["moyenne","grande","xl","xxl"],exclus_secteurs:["services_faible"]},{id:"hr_3",ref:"HR2.3",question:"Disposez-vous d'une stratégie pour traiter ces enjeux droits humains saillants ?",help:"Plan d'action documenté avec objectifs, échéances, responsables. Exigence des jalons Année 3/5 du cycle B Corp (Moyenne et plus, hors Services à faible empreinte) — pas due pour la recertification immédiate (Année 0).",examples:`Preuves attendues par l'auditeur : document de stratégie traitant des impacts négatifs saillants, décrivant comment l'entreprise va les adresser. Date de moins de 12 mois. Approuvée par la plus haute instance (PV ou signature). Étiquetage de chaque enjeu saillant avec un "type de connexion" (cause directe, contribution, lien). Plan d'implémentation incluant HR2.3.5a-d.`,tailles:["moyenne","grande","xl","xxl"],exclus_secteurs:["services_faible"],anneeY35:!0},{id:"hr_8",ref:"HR3.3",question:"Évaluez-vous les impacts négatifs potentiels sur les droits humains de vos clients organisationnels et projets ?",help:"HR3.3 concerne spécifiquement les entreprises du secteur Services à faible empreinte, à toutes les tailles, dès l'Année 0. Il s'agit d'évaluer si un client organisationnel ou un projet potentiel présente des risques pour les droits humains, et de prendre les mesures d'atténuation nécessaires (clauses contractuelles, conditions, refus). B Lab cible particulièrement certaines industries : sécurité et investigation, technologies de l'information et de la communication, publicité et études de marché, conseil juridique et de gestion, édition et production de contenus, ingénierie, conseil environnemental. Exemples de risques droits humains à évaluer selon l'activité : traitement de données personnelles sensibles, usages potentiellement discriminatoires de l'intelligence artificielle (biais, surveillance), accessibilité des livrables aux personnes en situation de handicap, conditions de travail dans les projets accompagnés, ou clients dans des secteurs à risque (armement, jeux d'argent, industries fossiles, surveillance).",examples:"Preuves attendues par l'auditeur : processus documenté d'évaluation des impacts droits humains des clients organisationnels et projets potentiels (grille d'analyse, checklist, charte d'acceptation client). Records d'évaluations réalisées sur les clients et projets matériels. Critères de décision documentés (acceptation, conditions, refus). Mesures d'atténuation prises le cas échéant (clauses contractuelles, due diligence renforcée). Entretiens avec les responsables commerciaux ou de projet.",tailles:["individuelle","micro","petite","moyenne","grande","xl","xxl"],secteurs:["services_faible"]},{id:"hr_9",ref:"HR3.4",question:"Évaluez-vous les impacts négatifs potentiels sur les droits humains de vos investissements ?",help:"HR3.4 concerne les entreprises de services à faible empreinte dont l'activité comporte de l'investissement (equity investing, conseil en investissement), à toutes les tailles, dès l'Année 0. Il s'agit d'évaluer les risques droits humains des investissements et de prendre les mesures d'atténuation nécessaires. Cette question n'apparaît que si une activité d'investissement a été indiquée dans le contexte du diagnostic.",examples:"Preuves attendues par l'auditeur : processus documenté d'évaluation des impacts droits humains des investissements. Records d'évaluations réalisées (due diligence ESG). Critères de décision et mesures d'atténuation. Politique d'investissement responsable le cas échéant.",tailles:["individuelle","micro","petite","moyenne","grande","xl","xxl"],secteurs:["services_faible"],requiresInvestment:!0},{id:"hr_4",ref:"HR3.1 / HR3.2",question:"Avez-vous un processus de remontée et de traitement des impacts négatifs réels et potentiels ?",help:"Mécanisme de grievance, processus de remédiation des impacts identifiés. HR3.1 (identification et priorisation) s'applique aux Moyennes hors Services à faible empreinte et aux Large+, dès l'Année 0. HR3.2 (mesures d'atténuation/remédiation) relève des jalons Année 3/5.",examples:"Preuves attendues par l'auditeur : document de procédure expliquant comment l'entreprise collecte, priorise et fait remonter l'information sur les impacts. Procédure liée aux réclamations. Records de traitement et d'escalade. Liste des rôles et responsabilités, ou références dans les fiches de poste. Records d'évaluation par sévérité et probabilité. Records d'engagement des parties prenantes selon le processus.",tailles:["moyenne","grande","xl","xxl"],exclus_secteurs:["services_faible"]},{id:"hr_5",ref:"HR4.2 / HR4.3",question:"Prenez-vous en compte les impacts droits humains dans vos décisions d'achat ?",help:"Critères droits humains intégrés dans la sélection et le suivi des fournisseurs, sur les décisions d'achat les plus matérielles. HR4.2 s'applique aux entreprises sans collaborateurs, Micro et Petites (tous secteurs) ainsi qu'aux Moyennes des secteurs de services. Les autres configurations relèvent de HR4.3 ou HR4.4.",examples:"Preuves attendues par l'auditeur : records annuels du processus pour déterminer les décisions d'achat les plus matérielles : rapports de dépenses, factures, bons de commande, évaluations d'impact. Records montrant comment les impacts sociaux ont été pris en compte : recherche, rapports internes, document récapitulatif des fournisseurs sélectionnés, records d'engagement avec fournisseurs, ratings externes.",tailles:["individuelle","micro","petite","moyenne"]},{id:"hr_6",ref:"HR4.9",question:"Recherchez-vous activement les écarts au salaire de subsistance dans vos contrats de prestation ?",help:"Spécifique aux services à faible empreinte qui sous-traitent : vérifier que les prestataires respectent le Living Wage.",examples:"Preuves attendues par l'auditeur : évaluation des contrats de prestation utilisant l'une ou plusieurs des méthodes prescrites par B Lab. Rapports d'évaluation des prestataires de service. Calcul des éventuels écarts de Living Wage là où il y a suffisamment de données. Liste des services pour lesquels aucune qualification formelle n'est requise.",tailles:["moyenne","grande","xl","xxl"],secteurs:["services_faible"]},{id:"hr_7",ref:"HR4.4",question:"Collaborez-vous avec vos fournisseurs prioritaires pour prévenir/atténuer les enjeux droits humains saillants ?",help:"Audits, plans d'amélioration conjoints, formation, vérifications terrain.",examples:"Preuves attendues par l'auditeur : liste des fournisseurs priorisés et document décrivant les critères de priorisation. Évidence d'un processus de priorisation basé sur les impacts négatifs réels et potentiels. Documentation des objectifs convenus avec les fournisseurs prioritaires et records de suivi annuel des progrès (slides ou PV de revues annuelles avec liste des participants, scorecards, rapports de performance). Records de projets de groupes de travail sectoriels ou collaborations multipartites (action collective).",tailles:["grande","xl","xxl"],exclus_secteurs:["services_faible"]}]},{id:"ca",code:"CA",name:"Action Climatique (Climate Action)",short:"Action Climatique",color:"#1d6e3a",icon:"◔",description:"Mesure annuelle des émissions GES, plan d'action climatique public, objectifs alignés 1,5°C (SBTi pour les grandes), plan de transition juste, mise en œuvre et reporting public des progrès. Codes B Lab : CA1 à CA3.",questions:[{id:"ca_1",ref:"CA1.1",question:"Mesurez-vous annuellement vos émissions de GES sur les Scopes 1, 2 et 3 ?",help:"Bilan carbone annuel complet (méthode Bilan Carbone® ADEME, GHG Protocol, ou ISO 14064-1:2018). Important : selon B Lab V2, la mesure annuelle complète Scopes 1+2+3 n'est exigée qu'aux entreprises Large, XL et XXL (à partir de l'année fiscale précédant Year 0). Pour les Petites et Moyennes, c'est le Climate Action Plan (CA2.1) qui s'applique en Year 0, pas la mesure GES — même si mesurer reste recommandé pour piloter le plan.",examples:"Preuves attendues par l'auditeur (Large+) : lien vers l'inventaire GES annuel public (ex. rapport annuel) sur le site de l'entreprise pour chaque année requise. L'inventaire doit inclure les éléments CA1.1.2a-f (émissions par scope, méthodologie, périmètre, année de base). Notes de méthodologie ou section conforme à CA1.1.4 a ou b (GHG Protocol ou ISO 14064-1).",tailles:["grande","xl","xxl"],critique:!0},{id:"ca_2",ref:"CA1.2",kind:"factual",question:"Votre inventaire annuel des émissions est-il vérifié par un tiers indépendant ?",help:"Vérification externe de la fiabilité du bilan carbone par un organisme accrédité (UKAS, COFRAC, DAkkS, ENAC, RvA — membres IAF).",examples:"Preuves attendues par l'auditeur : déclaration ou rapport de vérification d'un tiers indépendant accrédité pour l'inventaire GES. Certificat d'accréditation du tiers vérificateur pour un standard listé dans CA1.2.1, émis par un organisme national d'accréditation. Le rapport de vérification confirme que l'inventaire respecte CA1.2.2a-b.",tailles:["grande","xl","xxl"]},{id:"ca_3",ref:"CA2.1",question:"Disposez-vous d'un plan d'action climatique accessible publiquement ?",help:"Plan de transition décarbonation accessible sur votre site, avec objectifs et trajectoire. CA2.1 s'applique aux entreprises sans collaborateurs, Micro, Petites et Moyennes (dès l'Année 0). Pour ces tailles, la mesure des émissions GES n'est pas obligatoire — le plan d'action lui-même suffit. Les entreprises Large, XL et XXL relèvent d'un dispositif distinct (mesure GES CA1.1, SBT CA2.2, plan de transition CA2.3).",examples:"Preuves attendues par l'auditeur : lien vers le plan d'action climatique public sur le site. Si pas de site public : information officielle (brochure, contenu hébergé chez un tiers). Le plan doit respecter CA2.1.2a-e (engagement à supporter 1,5°C, actions concrètes, ressources allouées, gouvernance, calendrier). Documentation des ressources dédiées (budget, fiches de poste, projets). Approbation de la plus haute instance dirigeante (PV ou signature). Daté de moins de 36 mois.",tailles:["individuelle","micro","petite","moyenne"],critique:!0},{id:"ca_4",ref:"CA2.2",kind:"factual",question:"Vos objectifs climatiques sont-ils validés par la SBTi ou un tiers indépendant ?",help:"Science-Based Targets initiative — objectifs alignés sur les connaissances scientifiques pour limiter à 1,5°C. Exigence des jalons Année 3/5 du cycle B Corp (Large+).",examples:`Preuves attendues par l'auditeur : lettre de validation des cibles par la Science-Based Targets initiative (SBTi), listée sur le site SBTi comme "target approved", OU déclaration de vérification par un tiers indépendant. Certificat d'accréditation du tiers vérificateur. La lettre/déclaration confirme CA2.2.2a-b et CA2.2.3a-d (alignement 1,5°C, objectifs court terme + net zero 2050, scopes couverts, année de base).`,tailles:["grande","xl","xxl"],anneeY35:!0,critique:!0},{id:"ca_5",ref:"CA2.3",question:"Disposez-vous d'un plan de transition climatique vers le Net Zero 2050 ?",help:"Trajectoire documentée, juste, intégrant les parties prenantes, avec étapes intermédiaires et résorption des émissions résiduelles. Exigence des jalons Année 3/5 du cycle B Corp (Large+).",examples:"Preuves attendues par l'auditeur : document de plan de transition climatique incluant CA2.3.1a-g (trajectoire détaillée, gouvernance, ressources, actions par scope, jalons). Documentation des ressources dédiées (budget, fiches de poste, projets, investissements). Approbation de la plus haute instance dirigeante. Rapport vérifié par un tiers ou registres publics des absorptions résiduelles crédibles (avec quantité enregistrée).",tailles:["grande","xl","xxl"],anneeY35:!0},{id:"ca_6",ref:"CA3.3 / CA3.4",question:"Mettez-vous en œuvre activement votre plan d'action climatique avec un suivi des progrès ?",help:"Indicateurs suivis, comparaison annuelle, ajustements documentés. Exigence des jalons Année 3/5 du cycle B Corp — pas due pour la recertification immédiate (Année 0).",examples:"Preuves attendues par l'auditeur : records de progrès vs plan (rapport annuel, scorecards, tableurs, rapports de projets). Document mappant les actions au plan pour démontrer le progrès. Évidence des actions menées (ressources financières/RH investies, PV de réunions, slides, résumés de projets, témoignages parties prenantes). Plan le plus à jour. Records montrant les actions et la révision/mise à jour des cibles. Documentation de l'évaluation d'efficacité (PV, slides, processus d'évaluation).",anneeY35:!0},{id:"ca_7",ref:"CA3.6 / CA3.7",question:"Publiez-vous chaque année les progrès réalisés sur votre plan climat ?",help:"Reporting annuel public sur l'avancement de la trajectoire et l'efficacité des actions. Exigence des jalons Année 3/5 du cycle B Corp — pas due pour la recertification immédiate (Année 0).",examples:"Preuves attendues par l'auditeur : lien vers la page web ou rapport public où les progrès vs plan d'action climatique sont publiés (rapport annuel, page sustainability). Si pas de site public : information officielle (brochure, contenu chez un tiers). Pour CA3.7 (transition plan annuel) : la page ou le rapport doit inclure CA3.7.1a-d (progrès vs trajectoire, écarts et ajustements, émissions résiduelles, actions just transition).",anneeY35:!0}]},{id:"esc",code:"ESC",name:"Gestion Environnementale & Circularité",short:"Env. & Circularité",color:"#2f6b1f",icon:"◕",description:"Suivi des impacts (déchets, eau, énergie, biodiversité, bien-être animal), stratégie environnementale, transition biodiversité et eau, circularité, achats durables, traçabilité matières premières. Codes B Lab : ESC1 à ESC5.",questions:[{id:"esc_1",ref:"ESC1.1",question:"Suivez-vous la production de déchets de vos activités et leur destination finale ?",help:"Tonnage par type, taux de valorisation, exutoires identifiés. Distinction déchets dangereux / non-dangereux. Pour les entreprises agroalimentaires : distinction du gaspillage alimentaire.",examples:"Preuves attendues par l'auditeur : politique, document de processus ou Système de Management Environnemental (SME) expliquant l'approche de gestion des déchets. Rapport ou tableur montrant la répartition des méthodes d'élimination pour déchets dangereux et non-dangereux par année (ESC1.1.2-1.1.4). Manifeste de déchets dangereux ou documentation requise localement. Si destination inconnue : catégorisé comme mise en décharge. Vue par site (ou processus documenté de consolidation par site).",tailles:["micro","petite","moyenne","grande","xl","xxl"],exclus_secteurs:["services_faible"]},{id:"esc_2",ref:"ESC1.2",question:"Suivez-vous votre consommation d'énergie et sa répartition par source ?",help:"Suivi énergétique : électricité, chaleur, carburants, et part renouvelable. ESC1.2 s'applique aux entreprises Micro et plus, hors secteur Services à faible empreinte.",examples:"Preuves attendues par l'auditeur : politique ou SME expliquant l'approche de suivi énergétique. Si génération sur site (panneaux solaires) : photos d'installation, factures. Rapport ou tableur montrant la répartition de la consommation conformément à ESC1.2.2a-d (par source, renouvelable vs non, par site) pour chaque année requise. Vue par site ou processus documenté. Plan de gestion énergétique si tous les sites ne sont pas suivis.",tailles:["micro","petite","moyenne","grande","xl","xxl"],exclus_secteurs:["services_faible"]},{id:"esc_11",ref:"ESC1.3",question:"Suivez-vous votre consommation ou votre prélèvement d'eau ?",help:"Suivi de la consommation ou du prélèvement d'eau de l'entreprise sur l'ensemble de ses sites. ESC1.3 s'applique aux entreprises Micro et plus, hors secteur Services à faible empreinte.",examples:"Preuves attendues par l'auditeur : politique ou système de management environnemental expliquant l'approche de suivi de l'eau. Rapport ou tableur montrant la consommation ou le prélèvement d'eau par site pour chaque année requise. Factures d'eau. Vue par site ou processus documenté expliquant la couverture. Plan de gestion de l'eau si tous les sites ne sont pas encore suivis.",tailles:["micro","petite","moyenne","grande","xl","xxl"],exclus_secteurs:["services_faible"]},{id:"esc_3",ref:"ESC1.4 / ESC1.5",question:"Avez-vous évalué vos impacts environnementaux dans des zones de stress hydrique ou écologiquement sensibles ?",help:"Cartographie des sites d'opération vs zones sensibles (Water Risk Filter WWF, biodiversité, ENCORE). ESC1.4 (zones de stress hydrique) concerne les entreprises Moyenne et plus, hors secteur Services à faible empreinte. ESC1.5 (zones écologiquement sensibles) concerne les Moyenne et plus des secteurs Fabrication et Agriculture.",examples:"Preuves attendues par l'auditeur : liste de tous les sites contrôlés, mettant en évidence ceux situés dans des zones à risque. Évidence de recherche pour identifier les zones à haut risque (rapports gouvernementaux, contacts avec autorités locales, outils dédiés, études). Rapport montrant la consommation/prélèvement d'eau dans les sites en zone à risque. Pour ESC1.5 (zones écologiquement sensibles) : évaluation d'impact sur la biodiversité avec méthodologie, datée de moins de 36 mois.",tailles:["moyenne","grande","xl","xxl"],exclus_secteurs:["services_faible"]},{id:"esc_12",ref:"ESC1.7",question:"Avez-vous réalisé une évaluation de vos impacts environnementaux sur vos opérations et votre chaîne de valeur ?",help:"Évaluation identifiant les impacts environnementaux réels et potentiels, à la fois dans les opérations directes de l'entreprise et dans sa chaîne de valeur. ESC1.7 s'applique aux entreprises Moyenne et plus, hors secteur Services à faible empreinte. C'est le socle qui alimente la stratégie environnementale (ESC2, Années 3/5).",examples:"Preuves attendues par l'auditeur : rapport d'évaluation des impacts environnementaux couvrant les opérations directes ET la chaîne de valeur, avec la méthodologie utilisée. Document expliquant comment les impacts ont été identifiés et hiérarchisés (sévérité, probabilité). Liste des enjeux environnementaux matériels retenus. Évaluation datée de moins de 36 mois.",tailles:["moyenne","grande","xl","xxl"],exclus_secteurs:["services_faible"]},{id:"esc_8",ref:"ESC1.6",question:"Suivez-vous les conditions de bien-être animal dans vos activités ?",help:"ESC1.6 s'applique à toutes les tailles (sauf entreprises sans collaborateurs) et à tous les secteurs, dès l'Année 0. Concerne les animaux directement présents dans les opérations (élevage, expérimentation, animaux de travail) ou indirectement liés à l'activité. Pour une entreprise sans interaction animale, la réponse consiste à le documenter clairement.",examples:"Preuves attendues par l'auditeur : politique, document de processus ou Système de Management Environnemental décrivant l'approche du bien-être animal. Si l'entreprise n'a aucune interaction avec des animaux : déclaration documentée le confirmant. Sinon : records de suivi des conditions (espèces concernées, standards appliqués, audits, certifications type label bien-être animal).",tailles:["micro","petite","moyenne","grande","xl","xxl"]},{id:"esc_9",ref:"ESC2.6",question:"Évaluez-vous les impacts environnementaux négatifs potentiels de vos clients organisationnels et projets ?",help:"ESC2.6 concerne spécifiquement les entreprises du secteur Services à faible empreinte (conseil, IT, finance, juridique, design, R&D, communication, ingénierie), à toutes les tailles, dès l'Année 0. Il s'agit d'évaluer si un client ou un projet potentiel présente des risques environnementaux, et de prendre les mesures d'atténuation nécessaires (clauses, refus, conditions). Exemples de risques environnementaux à évaluer selon l'activité : empreinte carbone et ressources des solutions livrées, choix techniques structurants (hébergement, équipements, matériaux), durabilité des produits ou services conçus, usage raisonné des technologies à forte intensité énergétique (dont l'intelligence artificielle), ou clients dans des secteurs à forte empreinte dont les projets perpétueraient le modèle (énergies fossiles, aviation, fast fashion, industries extractives).",examples:"Preuves attendues par l'auditeur : processus documenté d'évaluation environnementale des clients organisationnels et projets potentiels (grille d'analyse, checklist, charte d'acceptation client). Records d'évaluations réalisées sur les clients et projets matériels. Critères de décision documentés (acceptation, conditions, refus). Mesures d'atténuation prises le cas échéant (clauses contractuelles, choix de sous-traitants ou fournisseurs à moindre impact, options techniques sobres). Entretiens avec les responsables commerciaux ou de projet.",tailles:["individuelle","micro","petite","moyenne","grande","xl","xxl"],secteurs:["services_faible"]},{id:"esc_10",ref:"ESC2.7",question:"Évaluez-vous les impacts environnementaux négatifs potentiels de vos investissements ?",help:"ESC2.7 concerne les entreprises de services à faible empreinte dont l'activité comporte de l'investissement (equity investing, conseil en investissement), à toutes les tailles, dès l'Année 0. Il s'agit d'évaluer les risques environnementaux des investissements et de prendre les mesures d'atténuation nécessaires. Cette question n'apparaît que si une activité d'investissement a été indiquée dans le contexte du diagnostic.",examples:"Preuves attendues par l'auditeur : processus documenté d'évaluation environnementale des investissements. Records d'évaluations réalisées (due diligence ESG). Critères de décision et mesures d'atténuation. Politique d'investissement responsable le cas échéant.",tailles:["individuelle","micro","petite","moyenne","grande","xl","xxl"],secteurs:["services_faible"],requiresInvestment:!0},{id:"esc_4",ref:"ESC2.1",question:"Avez-vous une stratégie environnementale formalisée pour réduire vos impacts négatifs ?",help:"Politique environnementale écrite, supervisée par la direction, avec objectifs, responsable identifié et plan d'implémentation. Exigence des jalons Année 3/5 du cycle B Corp (Moyenne et plus, hors Services à faible empreinte) — pas due pour la recertification immédiate (Année 0).",examples:"Preuves attendues par l'auditeur : document de stratégie traitant des impacts environnementaux matériels en opérations directes ET dans la chaîne de valeur, décrivant comment l'entreprise va adresser chaque impact. Stratégie ou plan d'implémentation associé incluant ESC2.1.2a-g. Approuvée par le comité exécutif ou la plus haute instance dirigeante (PV ou signature). Date de moins de 12 mois. PV confirmant la revue/adoption par la plus haute instance dans les 12 derniers mois.",anneeY35:!0},{id:"esc_5",ref:"ESC3.3",question:"Intégrez-vous les principes de circularité dans le développement de vos produits ?",help:"Réduction usage unique (a), conception long terme (b), recyclabilité après usage (c), recyclabilité en fin de vie (d). Au moins une option à choisir. Exigence des jalons Année 3/5 du cycle B Corp (Petite et plus, hors Services à faible empreinte) — pas due pour la recertification immédiate (Année 0).",examples:"Preuves attendues par l'auditeur : confirmation écrite des sous-exigences choisies (ESC3.3a-d). En cas de barrières légales : liens vers réglementations/normes santé-sécurité. Fiches techniques produits. Document expliquant comment le design respecte la hiérarchie des déchets. Records démontrant une augmentation du pourcentage d'indicateurs ou l'ajout d'une option supérieure dans la hiérarchie. Si plusieurs produits : pourcentage par poids couvert par les options. Records de membership dans pactes/collaborations sur la circularité (Ellen MacArthur Foundation).",anneeY35:!0},{id:"esc_6",ref:"ESC4.1 / ESC4.2",question:"Mettez-vous en place des actions concrètes pour prévenir/atténuer vos impacts environnementaux ?",help:"Actions documentées, indicateurs de progrès, ajustements selon les résultats. Exigence des jalons Année 3/5 du cycle B Corp — pas due pour la recertification immédiate (Année 0).",examples:"Preuves attendues par l'auditeur : records des actions menées (individuellement ou collectivement) et leurs résultats démontrables. Engagements internes et publics. Rapports de progrès, scorecards. Records de données et métriques d'impact. Records confirmant que les actions sont liées aux opérations ou à la chaîne de valeur. Pour ESC4.2 : évaluation de l'efficacité de la stratégie (rapport ou PV), records de consultations internes/externes, mise à jour de la stratégie suite à l'évaluation.",anneeY35:!0},{id:"esc_7",ref:"ESC5.1 / ESC5.2",question:"Prenez-vous en compte les impacts environnementaux dans vos décisions d'achat ?",help:"Critères environnementaux dans la sélection des fournisseurs, produits écolabellisés privilégiés, traçabilité, sur les décisions d'achat les plus matérielles. ESC5.1 s'applique aux entreprises sans collaborateurs, Micro et Petites de tous secteurs ; pour les Moyennes, la prise en compte des impacts environnementaux dans les achats reste due (ESC5.1 pour les secteurs de services, ESC5.2 pour les autres secteurs). Les Grandes et plus relèvent d'exigences fournisseurs distinctes.",examples:"Preuves attendues par l'auditeur : records annuels du processus pour déterminer les décisions d'achat les plus matérielles (rapports de dépenses, factures, bons de commande, évaluations d'impact). Records montrant comment les impacts environnementaux ont été pris en compte (recherche, rapports internes, document récapitulatif des fournisseurs sélectionnés, records d'engagement, ratings externes).",tailles:["individuelle","micro","petite","moyenne"]},{id:"esc_13",ref:"ESC3.1",question:"Suivez-vous les flux de matières entrant dans votre entreprise ?",help:"Suivi des matières premières et matériaux entrants utilisés par l'entreprise — quantités, types, et notamment la part de matières vierges non renouvelables. C'est le socle de la démarche de circularité (ESC3). ESC3.1 s'applique aux entreprises Grande et plus, hors secteur Services à faible empreinte.",examples:"Preuves attendues par l'auditeur : rapport ou tableur recensant les flux de matières entrant, par type de matériau et par quantité. Distinction entre matières vierges et matières recyclées/renouvelables. Processus documenté de collecte de ces données. Vue par site ou par ligne de produits le cas échéant.",tailles:["grande","xl","xxl"],exclus_secteurs:["services_faible"]},{id:"esc_14",ref:"ESC5.3",question:"Avez-vous une démarche d'engagement et de suivi de vos fournisseurs sur les enjeux environnementaux ?",help:"Pour les grandes entreprises, la prise en compte des achats va au-delà de la sélection : il s'agit de mettre en place une approche structurée d'engagement et de suivi des fournisseurs sur les enjeux environnementaux (collaboration, accompagnement, monitoring). ESC5.3 s'applique aux entreprises Grande et plus, hors secteur Services à faible empreinte.",examples:"Preuves attendues par l'auditeur : document décrivant l'approche d'engagement fournisseurs sur les enjeux environnementaux. Records de collaboration avec les fournisseurs (échanges, plans d'action conjoints, formations). Système de suivi de la performance environnementale des fournisseurs. Critères environnementaux dans le code de conduite fournisseurs ou les contrats.",tailles:["grande","xl","xxl"],exclus_secteurs:["services_faible"]}]},{id:"gaca",code:"GACA",name:"Affaires Publiques & Action Collective",short:"Affaires Publiques",color:"#5b3a8a",icon:"◖",description:"Lobbying responsable, transparence des contributions politiques, action collective pour l'impact systémique, fiscalité responsable. Codes B Lab : GACA1 à GACA3.",questions:[{id:"gaca_1",ref:"GACA1.1",question:"Disposez-vous d'une politique publique de lobbying responsable ?",help:"Politique formelle accessible, alignée sur vos engagements ESG. Couvre les cotisations à des associations professionnelles. GACA1.1 s'applique à toutes les tailles, dès l'Année 0.",examples:"Preuves attendues par l'auditeur : si l'entreprise ne fait pas de lobbying, elle publie (ou s'engage à publier) une déclaration sur son profil B Corp. Sinon : politique de lobbying sur le site web incluant GACA1.1 a-f (positions, processus de décision, contributions, gouvernance, transparence). Procès-verbaux de la plus haute instance approuvant la politique."},{id:"gaca_2",ref:"GACA1.2 / GACA1.3",question:"Êtes-vous transparent sur vos contributions politiques et activités de lobbying ?",help:"Reporting public des contributions financières et en nature, et des associations dont vous êtes membre. Calendrier selon la taille : pour les Grandes, XL et XXL, cette publication est due dès l'Année 0 (GACA1.2). Pour les entreprises sans collaborateurs, Micro, Petites et Moyennes, la même exigence (GACA1.3) ne s'applique qu'aux Années 3 et 5 — elle n'est donc pas requise pour une recertification immédiate (Année 0).",examples:"Preuves attendues par l'auditeur : rapport public sur le site avec les contributions politiques et un résumé des positions de lobbying matérielles. Procès-verbaux de la plus haute instance avec supervision du rapport. Rapports annuels publics cohérents avec GACA1.2.2 / GACA1.3. Si pas de lobbying : déclaration publiée sur le profil B Corp.",tailles:["grande","xl","xxl"]},{id:"gaca_3",ref:"GACA2",question:"Quelles actions collectives menez-vous, parmi les 5 types reconnus par B Lab ?",help:"GACA2 fonctionne comme un menu de choix : l'entreprise ne réalise pas les 5 types d'action collective, mais en sélectionne un nombre calibré sur sa taille. En Année 0 (recertification immédiate), les entreprises sans collaborateurs, Micro, Petites et Moyennes mettent en œuvre 1 action collective ; les Grandes, XL et XXL en mettent 2. Le nombre augmente en Années 3 et 5 selon la taille. La grille interactive ci-dessous permet de faire le point avec le client.",examples:"Preuves attendues par l'auditeur : confirmation écrite du ou des types d'action collective choisis. Pour mentorat : identification du mentee, comment le mentorat avance l'impact (mapping aux standards B Lab/ODD), confirmation du mentee, programme défini avec calendrier. Pour recherche externe : contribution (paiements, datasets, articles), publications, suivi à 12 mois. Pour collaboration multi-parties : partenaires, objectif et impacts mesurables (rapports annuels, PV), contribution de l'entreprise. Pour plaidoyer : records (paiements, lettres, pétitions), alignement social/environnemental, contribution. Pour leadership d'opinion : blogs, présentations, podcasts, articles publiés.",critique:!0,hasGacaMenu:!0},{id:"gaca_4",ref:"GACA3.1 / GACA3.2",question:"Adoptez-vous des pratiques de fiscalité responsable et transparente ?",help:"Politique fiscale documentée et publication du reporting pays par pays. Important : selon le tableau officiel B Lab V2, l'ensemble du domaine GACA3 (fiscalité) est applicable aux entreprises XXL uniquement — GACA3.1 (politique fiscale publique) dès l'Année 0, GACA3.2 (reporting pays par pays) en Années 3 et 5. Les entreprises de taille Grande et XL ne sont pas concernées par GACA3.",examples:"Preuves attendues par l'auditeur (XXL uniquement) : politique fiscale incluant GACA3.1.1 a-c et GACA3.1.2 a-f (autonome ou intégrée à un Code de Conduite, Code d'Éthique, Rapport Financier, Rapport d'Impact, ou GRI Tax Standard). Approbation par la plus haute instance dirigeante (PV ou signature). Pour GACA3.2 : rapport pays par pays incluant GACA3.2.1 a-c, supervisé par la plus haute instance dirigeante, accessible publiquement.",tailles:["xxl"]}]}],fa=`
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');

  .kiact-app {
    font-family: 'Manrope', system-ui, sans-serif;
    color: #0f1f1f;
    background: #FAFAF7;
    min-height: 100vh;
  }
  .kiact-display {
    font-family: 'Fraunces', Georgia, serif;
    font-feature-settings: "ss01" on, "ss02" on;
    letter-spacing: -0.01em;
  }
  .kiact-shadow {
    box-shadow: 0 1px 2px rgba(15,31,31,0.04), 0 8px 24px rgba(15,31,31,0.06);
  }
  .kiact-shadow-lg {
    box-shadow: 0 2px 4px rgba(15,31,31,0.04), 0 24px 48px rgba(15,31,31,0.08);
  }
  .kiact-card {
    background: white;
    border-radius: 14px;
    border: 1px solid rgba(15,31,31,0.06);
  }
  .kiact-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(15,31,31,0.12), transparent);
  }
  .kiact-grain {
    background-image: radial-gradient(circle at 1px 1px, rgba(15,31,31,0.04) 1px, transparent 0);
    background-size: 24px 24px;
  }
  .kiact-btn {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  .kiact-btn:hover {
    transform: translateY(-1px);
  }
  .progress-stripe {
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 8px,
      rgba(56, 141, 84, 0.06) 8px,
      rgba(56, 141, 84, 0.06) 16px
    );
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.4s ease-out forwards; }
  .answer-pill {
    transition: all 0.18s ease;
    cursor: pointer;
  }
  .answer-pill:hover {
    transform: scale(1.02);
  }

  /* === Styles d'impression PDF =========================================== */
  @media print {
    @page { size: A4; margin: 12mm 14mm; }
    body { background: white !important; }
    .kiact-app { background: white !important; }

    /* Masquer tout ce qui n'a pas de sens en PDF */
    .no-print { display: none !important; }
    header, /* Header app */
    nav, /* StepBar */
    button { display: none !important; }

    /* Le bloc consultant est masqué (info privée non partageable) */
    [data-consultant-only="true"] { display: none !important; }

    /* Cartes plus compactes en print */
    .kiact-card {
      box-shadow: none !important;
      border: 1px solid #e5e5e5 !important;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .kiact-shadow, .kiact-shadow-lg {
      box-shadow: none !important;
    }

    /* Couleurs préservées */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    /* Police légèrement réduite pour A4 */
    .kiact-display { font-size: 90% !important; }

    /* Sauts de page propres entre sections principales */
    h1, h2, h3 { page-break-after: avoid; }
  }
